plugins {
    id 'java'
}

group = 'org.example'
version = '0.1.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testImplementation 'io.rest-assured:rest-assured:5.5.5'
}

tasks.named('test') {
    useJUnitPlatform()
}
