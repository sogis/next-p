buildscript {
    repositories {
        maven { url 'https://repository.jboss.org/nexus/content/groups/public/' }
        maven { url 'https://plugins.gradle.org/m2/' }
        maven { url 'https://jars.interlis.ch' }
        maven { url 'https://repo.osgeo.org/repository/release/' }
        mavenCentral()
    }
    dependencies {
        classpath('ch.so.agi.gretl:ch.so.agi.gretl.gradle.plugin:3.2.863') {
            exclude group: 'javax.media', module: 'jai_core'
        }
        classpath 'javax.media:jai-core:1.1.3'
    }
}

apply plugin: 'ch.so.agi.gretl'

// Production aggregate host. Individual tests use transformer-host.gradle in a
// temporary project and apply only their transformer definition(s).
apply from: 'transformer-host.gradle'

description = 'POC transformer runner for DuckDB.'

// inputDir is the production contract for future external JSON preparation.
// The helloWorld POC creates its own local input relation and does not read it.
apply from: 'helloWorld/transformer.gradle'
apply from: 'helloUniverse/transformer.gradle'

defaultTasks 'helloUniverse'
