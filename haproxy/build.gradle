plugins {
    id 'java'
}

group = 'org.example'
version = '0.1.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testImplementation 'io.rest-assured:rest-assured:5.5.5'
}

tasks.named('test') {
    useJUnitPlatform {
        excludeTags 'integration'
    }
}

def fifoSystemProperties = System.properties.findAll { key, value ->
    key.toString().startsWith('fifo.')
}

tasks.withType(Test).configureEach {
    systemProperties fifoSystemProperties
}

def loggingFeasibilityTest = tasks.register('loggingFeasibilityTest', Test) {
    group = 'verification'
    description = 'Verifies QGIS execution-start correlation against the running Compose stack.'
    useJUnitPlatform {
        includeTags 'feasibility'
    }
}

def directQgisBaselineTest = tasks.register('directQgisBaselineTest', Test) {
    group = 'verification'
    description = 'Demonstrates a bounded direct-QGIS execution-start inversion.'
    useJUnitPlatform {
        includeTags 'direct-baseline'
    }
    mustRunAfter loggingFeasibilityTest
}

tasks.register('fifoTest') {
    group = 'verification'
    description = 'Runs the FIFO integration-test pipeline, beginning with logging feasibility.'
    dependsOn loggingFeasibilityTest, directQgisBaselineTest
}
