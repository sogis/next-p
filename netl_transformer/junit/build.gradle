apply plugin: 'java'

repositories {
    mavenCentral()
}

dependencies {
    testImplementation gradleTestKit()
    // Keep the JDBC storage format aligned with the Gretl runtime used by the
    // production task graph.
    testImplementation 'org.duckdb:duckdb_jdbc:1.2.2.0'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testImplementation 'org.assertj:assertj-core:3.27.7'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
    maxHeapSize = '256m'
}
