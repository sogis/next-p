name: qgis-haproxy-fifo

services:
  qgis-1:
    image: ${QGIS_SERVER_IMAGE:-qgis/qgis-server:3.40}
    environment: &qgis-environment
      QGIS_PROJECT_FILE: /io/data/fifo.qgs
      QGIS_SERVER_LOG_LEVEL: "0"
      QGIS_SERVER_LOG_STDERR: "1"
      QGIS_SERVER_PARALLEL_RENDERING: "false"
    volumes:
      - ./qgis/projects:/io/data:ro
      - ./qgis/plugins:/io/plugins:ro
      - ./qgis/nginx/fastcgi_params:/etc/nginx/fastcgi_params:ro
    ports:
      - "${QGIS_1_HTTP_PORT:-18081}:80"
    healthcheck:
      test:
        ["CMD-SHELL", "wget -q -O /dev/null 'http://127.0.0.1/ows/?SERVICE=WMS&VERSION=1.3.0&REQUEST=GetCapabilities'"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 20s

  qgis-2:
    image: ${QGIS_SERVER_IMAGE:-qgis/qgis-server:3.40}
    environment: *qgis-environment
    volumes:
      - ./qgis/projects:/io/data:ro
      - ./qgis/plugins:/io/plugins:ro
      - ./qgis/nginx/fastcgi_params:/etc/nginx/fastcgi_params:ro
    ports:
      - "${QGIS_2_HTTP_PORT:-18082}:80"
    healthcheck:
      test:
        ["CMD-SHELL", "wget -q -O /dev/null 'http://127.0.0.1/ows/?SERVICE=WMS&VERSION=1.3.0&REQUEST=GetCapabilities'"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 20s

  qgis-3:
    image: ${QGIS_SERVER_IMAGE:-qgis/qgis-server:3.40}
    environment: *qgis-environment
    volumes:
      - ./qgis/projects:/io/data:ro
      - ./qgis/plugins:/io/plugins:ro
      - ./qgis/nginx/fastcgi_params:/etc/nginx/fastcgi_params:ro
    ports:
      - "${QGIS_3_HTTP_PORT:-18083}:80"
    healthcheck:
      test:
        ["CMD-SHELL", "wget -q -O /dev/null 'http://127.0.0.1/ows/?SERVICE=WMS&VERSION=1.3.0&REQUEST=GetCapabilities'"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 20s

  qgis-4:
    image: ${QGIS_SERVER_IMAGE:-qgis/qgis-server:3.40}
    environment: *qgis-environment
    volumes:
      - ./qgis/projects:/io/data:ro
      - ./qgis/plugins:/io/plugins:ro
      - ./qgis/nginx/fastcgi_params:/etc/nginx/fastcgi_params:ro
    ports:
      - "${QGIS_4_HTTP_PORT:-18084}:80"
    healthcheck:
      test:
        ["CMD-SHELL", "wget -q -O /dev/null 'http://127.0.0.1/ows/?SERVICE=WMS&VERSION=1.3.0&REQUEST=GetCapabilities'"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 20s

  haproxy:
    image: ${HAPROXY_IMAGE:-haproxy:3.0.9-alpine}
    depends_on:
      qgis-1:
        condition: service_healthy
      qgis-2:
        condition: service_healthy
      qgis-3:
        condition: service_healthy
      qgis-4:
        condition: service_healthy
    ports:
      - "${HAPROXY_HTTP_PORT:-18080}:8080"
    volumes:
      - ./haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
      - ./haproxy/lua/arrival_logger.lua:/usr/local/etc/haproxy/lua/arrival_logger.lua:ro
    healthcheck:
      test: ["CMD", "haproxy", "-c", "-f", "/usr/local/etc/haproxy/haproxy.cfg"]
      interval: 5s
      timeout: 3s
      retries: 12
