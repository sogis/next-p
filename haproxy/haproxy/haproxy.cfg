global
    log stdout format raw local0 info
    # A single HAProxy thread is required before arrival sequencing is added;
    # it prevents a later logger from accidentally becoming per-thread.
    nbthread 1

defaults
    mode http
    log global
    option httplog
    option http-keep-alive
    timeout connect 5s
    timeout client 60s
    timeout server 60s
    timeout queue 60s

frontend qgis_http
    bind :8080
    # Capture request correlation values in the transaction log. These fields
    # are not yet an acceptance sequence; step 5 adds that instrumentation.
    http-request capture req.hdr(X-Run-Id) len 64
    http-request capture req.hdr(X-Request-Id) len 64
    default_backend qgis_fifo

backend qgis_fifo
    # Production-like treatment: every replica is active, but HAProxy permits
    # only one active connection to each QGIS instance. Requests exceeding the
    # four available slots wait in HAProxy and are later dispatched by it.
    balance roundrobin
    server qgis-1 qgis-1:80 check maxconn 1
    server qgis-2 qgis-2:80 check maxconn 1
    server qgis-3 qgis-3:80 check maxconn 1
    server qgis-4 qgis-4:80 check maxconn 1
